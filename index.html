<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Registrasi Pastel</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #c1e1f7, #fff9c4);
      color: #37474f;
      padding: 40px;
    }

    h2 {
      text-align: center;
      color: #7da3c8;
      margin-bottom: 20px;
    }

    form {
      background: #ffffff;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      position: relative;
    }

    label {
      font-weight: 500;
      color: #546e7a;
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 14px;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      background: #f1f8ff;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus {
      border-color: #64b5f6;
      background: #ffffff;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #9fd4ff;
      border: none;
      border-radius: 10px;
      color: #263238;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* autocomplete */
    .autocomplete-box {
      position: absolute;
      width: calc(100% - 50px);
      background: #ffffff;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      z-index: 1000;
      max-height: 150px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-box.show {
      display: block;
    }

    .autocomplete-item {
      padding: 10px;
      cursor: pointer;
    }

    .autocomplete-item:hover {
      background: #e3f2fd;
    }
  </style>
</head>

<body>

<h2>Form Registrasi Mahasiswa</h2>

<form onsubmit="return validateForm()">
  <label>Nama Mahasiswa:</label>
  <input type="text" id="nama" autocomplete="off">
  <div id="suggestions" class="autocomplete-box"></div>

  <label>NIM:</label>
  <input type="text" id="nim">

  <label>Mata Kuliah:</label>
  <input type="text" id="matkul">

  <label>Dosen:</label>
  <input type="text" id="dosen">

  <button type="submit">Submit</button>
</form>

<script>
  const dataNama = [
    "Aditya Nugraha",
    "Belvany Virginia",
    "Sitti Aminah",
    "Dayyan Ghazanfar",
    "Shabrina Sarayati",
    "Fazle Mawla",
    "Jylan Annisa Mumtaza"
  ];

  const input = document.getElementById("nama");
  const suggestionBox = document.getElementById("suggestions");

  input.addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    suggestionBox.innerHTML = "";

    if (value === "") {
      suggestionBox.classList.remove("show");
      return;
    }

    let filtered = dataNama.filter(nama =>
      nama.toLowerCase().includes(value)
    );

    filtered.forEach(nama => {
      let div = document.createElement("div");
      div.classList.add("autocomplete-item");
      div.innerText = nama;

      div.addEventListener("click", function() {
        input.value = nama;
        suggestionBox.innerHTML = "";
        suggestionBox.classList.remove("show");
      });

      suggestionBox.appendChild(div);
    });

    if (filtered.length > 0) {
      suggestionBox.classList.add("show");
    } else {
      suggestionBox.classList.remove("show");
    }
  });

  // validasi sederhana
  function validateForm() {
    let nama = document.getElementById("nama").value;
    let nim = document.getElementById("nim").value;
    let matkul = document.getElementById("matkul").value;
    let dosen = document.getElementById("dosen").value;

    if (nama === "" || nim === "" || matkul === "" || dosen === "") {
      alert("Semua field harus diisi!");
      return false;
    }

    alert("Data berhasil dikirim!");
    return true;
  }
</script>

</body>
</html>
